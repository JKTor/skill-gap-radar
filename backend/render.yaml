services:
  - type: web
    name: skill-gap-radar-api
    runtime: python
    pythonVersion: "3.12.7"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false  # ตั้งค่าใน Render dashboard (ชี้ไป Neon PostgreSQL)
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
